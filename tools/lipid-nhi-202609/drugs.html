<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>查可用藥物｜健保降血脂藥物評估工具｜看診工具箱</title>
<link rel="stylesheet" href="../../common/style.css">
<link rel="stylesheet" href="tool.css">
</head>
<body>
<main>
  <h1>查可用藥物（降血脂）</h1>
  <div class="notice">
    <p>參考查詢頁：不讀取評估工具輸入的病人資料，查詢結果也不會帶回評估表單。</p>
  </div>

  <section class="sec" id="intensity"></section>

  <section class="sec">
    <h2>給付規定 2.6 藥品代碼／藥名查詢</h2>
    <label class="num">健保代碼 10 碼，或藥名／成分部分字串<input type="search" id="drug-q" autocomplete="off"></label>
    <button type="button" id="drug-q-btn">查詢</button>
    <p class="hint">給付規定原文清單只列英文藥名，請以英文藥名或代碼查詢。清單依 115/10/22 版完整給付規定；品項會分階段調整。</p>
    <div id="drug-q-out" aria-live="polite"></div>
  </section>
</main>
<script type="module" src="drugs.js"></script>
</body>
</html>
